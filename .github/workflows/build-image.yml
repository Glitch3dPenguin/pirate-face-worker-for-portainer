name: Build & Push
on:
  push:
    branches: [main]
  schedule:
    # 03:17 UTC daily — PyPI-latest at that moment becomes :latest.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the current PyPI latest
        id: ver
        run: |
          V=$(wget -qO- -U "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
                https://pypi.org/pypi/pirateface/json \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # GHCR package names are lowercase-enforced, and the workflow-dispatch
      # parser rejects expressions like ${{ github.repository | lower }} —
      # compute the lowercase in a step, never in an expression.
      - name: Lowercase repo for the GHCR tag
        id: repo
        run: echo "name=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.ver.outputs.version }}
          build-args: |
            PIRATEFACE_VERSION=${{ steps.ver.outputs.version }}
